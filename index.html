<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a0308" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>24K Gold Pyramid &amp; Crimson Silk Motion Intro</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-512.png" />
<style>
  :root {
    --crimson-deep: #140206;
    --crimson-mid: #3a0612;
    --crimson-silk: #610b1f;
    --gold-dark: #996515;
    --gold-mid: #d4af37;
    --gold-bright: #ffe07d;
    --gold-glow: rgba(255, 215, 80, 0.55);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--crimson-deep);
    color: var(--gold-bright);
    font-family: "Cinzel", "Playfair Display", Georgia, "Times New Roman", serif;
    user-select: none;
  }

  /* Crimson Silk Animated Backdrop */
  .silk-stage {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 42%, rgba(125, 16, 40, 0.72) 0%, rgba(46, 4, 14, 0.92) 55%, #0e0104 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .silk-sheen {
    position: absolute;
    inset: -30%;
    background:
      repeating-linear-gradient(
        115deg,
        rgba(255, 255, 255, 0.02) 0px,
        rgba(255, 255, 255, 0.05) 35px,
        rgba(0, 0, 0, 0.14) 70px,
        rgba(255, 215, 0, 0.03) 105px
      );
    animation: silkWave 14s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes silkWave {
    0% { transform: translate3d(-4%, -2%, 0) rotate(-1deg) scale(1.04); }
    100% { transform: translate3d(4%, 2%, 0) rotate(1.5deg) scale(1.08); }
  }

  /* Floating Gold Particles Canvas */
  #goldParticles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  /* Custom MP4 Video Override Layer */
  #customVideoLayer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 3;
    display: none;
    background: #000;
  }

  /* Built-In 24K Gold Pyramid & Eye of Horus Splash Container */
  #builtInMotionContainer {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    max-width: 680px;
    width: 100%;
    transition: opacity 0.85s ease, transform 0.85s ease;
  }

  #builtInMotionContainer.hidden-by-video {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.96);
  }

  .crest-wrapper {
    position: relative;
    width: min(310px, 68vw);
    height: min(310px, 68vw);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    filter: drop-shadow(0 0 28px rgba(212, 175, 55, 0.45));
  }

  .halo-ring {
    position: absolute;
    inset: 6%;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 224, 125, 0.35);
    box-shadow: inset 0 0 30px rgba(212, 175, 55, 0.18), 0 0 35px rgba(212, 175, 55, 0.2);
    animation: pulseHalo 4s ease-in-out infinite;
  }

  .halo-ring-inner {
    position: absolute;
    inset: 14%;
    border-radius: 50%;
    border: 1px dashed rgba(255, 224, 125, 0.45);
    animation: spinSlow 28s linear infinite;
  }

  @keyframes pulseHalo {
    0%, 100% { transform: scale(0.98); opacity: 0.7; }
    50% { transform: scale(1.03); opacity: 1; }
  }

  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .pyramid-svg {
    width: 84%;
    height: 84%;
    overflow: visible;
  }

  .anim-rise {
    opacity: 0;
    transform: translateY(18px) scale(0.95);
  }

  .playing .anim-rise {
    animation: crestReveal 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .playing .anim-eye {
    opacity: 0;
    animation: eyeAwaken 1.2s ease-out 0.65s forwards;
  }

  .playing .anim-title {
    opacity: 0;
    transform: translateY(12px);
    animation: textReveal 1.1s ease-out 1.05s forwards;
  }

  .playing .anim-sub {
    opacity: 0;
    transform: translateY(10px);
    animation: textReveal 1.1s ease-out 1.35s forwards;
  }

  @keyframes crestReveal {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes eyeAwaken {
    0% { opacity: 0; filter: brightness(0.4); }
    60% { opacity: 1; filter: brightness(1.5) drop-shadow(0 0 12px #ffe07d); }
    100% { opacity: 1; filter: brightness(1.1) drop-shadow(0 0 6px #d4af37); }
  }

  @keyframes textReveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .brand-title {
    font-size: clamp(1.2rem, 3.8vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff5c0 0%, #e5be46 48%, #9d6b18 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
    margin-bottom: 8px;
  }

  .brand-subtitle {
    font-size: clamp(0.68rem, 2vw, 0.88rem);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(255, 226, 140, 0.84);
  }

  /* Post-Intro Ready State Banner */
  #introCompleteBadge {
    margin-top: 22px;
    padding: 8px 18px;
    border: 1px solid rgba(212, 175, 55, 0.45);
    border-radius: 999px;
    background: rgba(20, 2, 6, 0.65);
    backdrop-filter: blur(8px);
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-bright);
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #introCompleteBadge.visible {
    opacity: 1;
  }

  /* Top & Bottom Floating Control Bar */
  .controls-bar {
    position: fixed;
    bottom: max(22px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(16, 2, 6, 0.78);
    border: 1px solid rgba(212, 175, 55, 0.42);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
    max-width: 94vw;
  }

  .btn-gold {
    appearance: none;
    border: 1px solid rgba(255, 224, 125, 0.5);
    background: linear-gradient(180deg, rgba(84, 12, 28, 0.9) 0%, rgba(36, 4, 11, 0.95) 100%);
    color: var(--gold-bright);
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 9px 15px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.22s ease;
    white-space: nowrap;
  }

  .btn-gold:hover, .btn-gold:active {
    border-color: var(--gold-bright);
    box-shadow: 0 0 16px var(--gold-glow);
    transform: translateY(-1px);
  }

  .btn-gold.primary {
    background: linear-gradient(180deg, #f3ce5e 0%, #b5811c 100%);
    color: #1a0308;
    border-color: #fff0a8;
    font-weight: 700;
  }

  .btn-gold.danger {
    border-color: rgba(255, 110, 110, 0.5);
    color: #ffb3b3;
    display: none;
  }

  .status-pill {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: 18px;
    z-index: 10;
    padding: 6px 13px;
    border-radius: 999px;
    background: rgba(16, 2, 6, 0.72);
    border: 1px solid rgba(212, 175, 55, 0.35);
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold-bright);
    backdrop-filter: blur(8px);
  }

  input[type="file"] {
    display: none;
  }
</style>
</head>
<body>

<div class="silk-stage">
  <div class="silk-sheen"></div>
  <canvas id="goldParticles"></canvas>

  <!-- Custom .mp4 Intro Override Video -->
  <video id="customVideoLayer" playsinline muted></video>

  <!-- Status Indicator -->
  <div class="status-pill" id="modeIndicator">Mode: 24K Gold Pyramid Motion</div>

  <!-- Built-In 24K Gold Pyramid & Eye of Horus Splash -->
  <div id="builtInMotionContainer" class="playing">
    <div class="crest-wrapper anim-rise">
      <div class="halo-ring"></div>
      <div class="halo-ring-inner"></div>

      <svg class="pyramid-svg" viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg" aria-label="24K Gold Pyramid and Eye of Horus">
        <defs>
          <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff4b8" />
            <stop offset="45%" stop-color="#e2b63b" />
            <stop offset="100%" stop-color="#9e6b14" />
          </linearGradient>
          <linearGradient id="goldRight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c99724" />
            <stop offset="100%" stop-color="#5e3b06" />
          </linearGradient>
          <linearGradient id="capstoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff9d2" />
            <stop offset="100%" stop-color="#d4af37" />
          </linearGradient>
          <filter id="goldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- Pyramid Body -->
        <polygon points="150,24 26,242 150,242" fill="url(#goldLeft)" stroke="#ffe58f" stroke-width="1.5" />
        <polygon points="150,24 274,242 150,242" fill="url(#goldRight)" stroke="#d4af37" stroke-width="1.5" />

        <!-- Subtle Masonry Lines -->
        <line x1="112" y1="90" x2="188" y2="90" stroke="#3c1f03" stroke-opacity="0.45" stroke-width="1.2" />
        <line x1="88" y1="132" x2="212" y2="132" stroke="#3c1f03" stroke-opacity="0.45" stroke-width="1.2" />
        <line x1="65" y1="172" x2="235" y2="172" stroke="#3c1f03" stroke-opacity="0.45" stroke-width="1.2" />
        <line x1="44" y1="210" x2="256" y2="210" stroke="#3c1f03" stroke-opacity="0.45" stroke-width="1.2" />

        <!-- Illuminated Capstone -->
        <polygon points="150,24 112,90 188,90" fill="url(#capstoneGrad)" filter="url(#goldGlowFilter)" />

        <!-- Eye of Horus Emblem -->
        <g class="anim-eye" transform="translate(150, 146)" filter="url(#goldGlowFilter)">
          <!-- Eyebrow -->
          <path d="M -34 -18 Q 0 -34 36 -14" fill="none" stroke="#fff3b0" stroke-width="3.2" stroke-linecap="round" />
          <!-- Eye Outline -->
          <path d="M -30 0 Q 0 -20 30 0 Q 0 18 -30 0 Z" fill="#1b0309" stroke="#ffe58f" stroke-width="2.6" />
          <!-- Iris & Pupil -->
          <circle cx="0" cy="-1" r="8.5" fill="#e6b83a" />
          <circle cx="0" cy="-1" r="4" fill="#1b0309" />
          <circle cx="-2.5" cy="-3.5" r="1.5" fill="#ffffff" />
          <!-- Horus Cheek Drop & Spiral -->
          <path d="M -4 11 L -4 26 Q -4 34 -13 33 Q -19 31 -17 25" fill="none" stroke="#ffe58f" stroke-width="2.6" stroke-linecap="round" />
          <path d="M 8 9 L 22 25" fill="none" stroke="#ffe58f" stroke-width="2.6" stroke-linecap="round" />
        </g>
      </svg>
    </div>

    <div class="brand-title anim-title">24K SOVEREIGN</div>
    <div class="brand-subtitle anim-sub">Pyramid &amp; Crimson Silk Motion Intro</div>

    <div id="introCompleteBadge">Intro Complete &bull; Ready</div>
  </div>

  <!-- Trigger & Override Controls -->
  <div class="controls-bar">
    <button class="btn-gold" id="skipBtn" type="button">Skip Intro</button>
    <button class="btn-gold primary" id="replayBtn" type="button">Replay Intro</button>
    <label class="btn-gold" for="mp4UploadInput">Load Custom .MP4</label>
    <input type="file" id="mp4UploadInput" accept="video/mp4,video/*" />
    <button class="btn-gold" id="soundToggleBtn" type="button" style="display:none;">Unmute Video</button>
    <button class="btn-gold danger" id="clearCustomBtn" type="button">Reset Default</button>
  </div>
</div>

<script>
  // --- 1. Floating 24K Gold Particles Engine ---
  const canvas = document.getElementById("goldParticles");
  const ctx = canvas.getContext("2d");
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function createParticles(count = 75) {
    particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.4 + 0.6,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -(Math.random() * 0.55 + 0.15),
        alpha: Math.random() * 0.75 + 0.2,
        twinkle: Math.random() * 0.03 + 0.01
      });
    }
  }
  createParticles();

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.alpha += p.twinkle;
      if (p.alpha > 0.95 || p.alpha < 0.15) p.twinkle *= -1;

      if (p.y < -10) {
        p.y = canvas.height + 10;
        p.x = Math.random() * canvas.width;
      }
      if (p.x < -10) p.x = canvas.width + 10;
      if (p.x > canvas.width + 10) p.x = -10;

      ctx.beginPath();
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.4);
      grad.addColorStop(0, `rgba(255, 240, 165, ${p.alpha})`);
      grad.addColorStop(0.5, `rgba(212, 175, 55, ${p.alpha * 0.7})`);
      grad.addColorStop(1, "rgba(212, 175, 55, 0)");
      ctx.fillStyle = grad;
      ctx.arc(p.x, p.y, p.r * 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // --- 2. IndexedDB Persistence for Custom .MP4 Intro Override ---
  const DB_NAME = "GoldPyramidIntroDB";
  const STORE_NAME = "customIntroStore";
  const VIDEO_KEY = "custom_mp4_blob";

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore(STORE_NAME);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveCustomVideoBlob(blob) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put(blob, VIDEO_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadCustomVideoBlob() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(VIDEO_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async function clearCustomVideoBlob() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).delete(VIDEO_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // --- 3. Intro Playback, Skip, Replay & Custom .MP4 Logic ---
  const builtInContainer = document.getElementById("builtInMotionContainer");
  const customVideo = document.getElementById("customVideoLayer");
  const completeBadge = document.getElementById("introCompleteBadge");
  const modeIndicator = document.getElementById("modeIndicator");
  const skipBtn = document.getElementById("skipBtn");
  const replayBtn = document.getElementById("replayBtn");
  const mp4UploadInput = document.getElementById("mp4UploadInput");
  const clearCustomBtn = document.getElementById("clearCustomBtn");
  const soundToggleBtn = document.getElementById("soundToggleBtn");

  let introTimer = null;
  let activeVideoURL = null;
  let hasCustomVideo = false;

  function markIntroComplete() {
    clearTimeout(introTimer);
    if (hasCustomVideo) {
      customVideo.pause();
      customVideo.style.display = "none";
      builtInContainer.classList.remove("hidden-by-video");
    }
    completeBadge.classList.add("visible");
  }

  function playIntro() {
    clearTimeout(introTimer);
    completeBadge.classList.remove("visible");

    if (hasCustomVideo && activeVideoURL) {
      modeIndicator.textContent = "Mode: Custom .MP4 Intro Override";
      clearCustomBtn.style.display = "inline-block";
      soundToggleBtn.style.display = "inline-block";
      builtInContainer.classList.add("hidden-by-video");
      customVideo.style.display = "block";
      customVideo.currentTime = 0;
      customVideo.play().catch(() => {
        customVideo.muted = true;
        customVideo.play();
      });
    } else {
      modeIndicator.textContent = "Mode: 24K Gold Pyramid Motion";
      clearCustomBtn.style.display = "none";
      soundToggleBtn.style.display = "none";
      customVideo.style.display = "none";
      builtInContainer.classList.remove("hidden-by-video");

      // Restart CSS keyframe animations cleanly
      builtInContainer.classList.remove("playing");
      void builtInContainer.offsetWidth;
      builtInContainer.classList.add("playing");

      introTimer = setTimeout(() => {
        markIntroComplete();
      }, 3600);
    }
  }

  customVideo.addEventListener("ended", markIntroComplete);

  skipBtn.addEventListener("click", () => {
    markIntroComplete();
  });

  replayBtn.addEventListener("click", () => {
    playIntro();
  });

  soundToggleBtn.addEventListener("click", () => {
    customVideo.muted = !customVideo.muted;
    soundToggleBtn.textContent = customVideo.muted ? "Unmute Video" : "Mute Video";
  });

  mp4UploadInput.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    await saveCustomVideoBlob(file);
    if (activeVideoURL) URL.revokeObjectURL(activeVideoURL);
    activeVideoURL = URL.createObjectURL(file);
    customVideo.src = activeVideoURL;
    hasCustomVideo = true;
    playIntro();
  });

  clearCustomBtn.addEventListener("click", async () => {
    await clearCustomVideoBlob();
    if (activeVideoURL) URL.revokeObjectURL(activeVideoURL);
    activeVideoURL = null;
    customVideo.removeAttribute("src");
    hasCustomVideo = false;
    mp4UploadInput.value = "";
    playIntro();
  });

  // Boot sequence: check if custom .mp4 override exists offline
  (async function init() {
    try {
      const savedBlob = await loadCustomVideoBlob();
      if (savedBlob) {
        activeVideoURL = URL.createObjectURL(savedBlob);
        customVideo.src = activeVideoURL;
        hasCustomVideo = true;
      }
    } catch (err) {
      console.warn("IndexedDB unavailable, using built-in motion intro.");
    }
    playIntro();
  })();

  // Register offline Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>

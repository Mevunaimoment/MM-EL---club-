<!-- === MM'EL v24 RESPONSIVE SIDEBAR LAYOUT UPGRADE === -->
<style>
  :root {
    --mmel-sidebar-w: 320px;
    --mmel-bg-deep: #24040b;
    --mmel-bg-card: #3a0712;
    --mmel-gold: #d4af37;
    --mmel-gold-soft: rgba(212, 175, 55, 0.25);
  }

  /* Desktop Collapse Toggle */
  #mmel-sidebar-toggle {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 9998;
    background: rgba(58, 7, 18, 0.92);
    color: var(--mmel-gold);
    border: 1px solid var(--mmel-gold-soft);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.25s ease;
  }
  #mmel-sidebar-toggle:hover {
    border-color: var(--mmel-gold);
    box-shadow: 0 0 14px rgba(212, 175, 55, 0.35);
  }

  /* Desktop Split-Screen Sidebar Shell */
  @media (min-width: 960px) {
    #mmel-sidebar-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    body.mmel-sidebar-active {
      display: grid !important;
      grid-template-columns: var(--mmel-sidebar-w) 1fr !important;
      min-height: 100vh;
      margin: 0;
      padding: 0 !important;
      overflow-x: hidden;
    }

    body.mmel-sidebar-active.mmel-sidebar-collapsed {
      grid-template-columns: 0px 1fr !important;
    }

    #mmel-sovereign-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: var(--mmel-sidebar-w);
      overflow-y: auto;
      padding: 54px 18px 24px;
      background: linear-gradient(180deg, #3a0712 0%, #24040b 100%);
      border-right: 1px solid var(--mmel-gold-soft);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 900;
      transition: transform 0.3s ease, opacity 0.25s ease;
    }

    body.mmel-sidebar-collapsed #mmel-sovereign-sidebar {
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Keep Sovereign Reel Cinema & Pyramid Visualizer compact in sidebar */
    #mmel-sovereign-sidebar video,
    #mmel-sovereign-sidebar canvas {
      width: 100% !important;
      max-height: 210px !important;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--mmel-gold-soft);
    }

    #mmel-sovereign-main {
      padding: 28px 36px 80px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* Convert bottom nav (13 Suites / Art & Couture / Concierge / VIP Pass) into vertical sidebar menu */
    #mmel-sovereign-sidebar nav,
    #mmel-sovereign-sidebar [class*="bottom-nav"],
    #mmel-sovereign-sidebar [class*="tab-bar"] {
      position: static !important;
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
      gap: 8px;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
    }

    #mmel-sovereign-sidebar nav button,
    #mmel-sovereign-sidebar nav a,
    #mmel-sovereign-sidebar [class*="bottom-nav"] button {
      width: 100% !important;
      justify-content: flex-start !important;
      text-align: left !important;
      padding: 10px 14px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(212, 175, 55, 0.18) !important;
      background: rgba(255, 255, 255, 0.03) !important;
    }

    #mmel-sovereign-sidebar::-webkit-scrollbar {
      width: 4px;
    }
    #mmel-sovereign-sidebar::-webkit-scrollbar-thumb {
      background: var(--mmel-gold-soft);
      border-radius: 4px;
    }
  }
</style>

<script>
  (function initMMELSidebar() {
    if (document.getElementById('mmel-sovereign-sidebar')) return;

    const toggleBtn = document.createElement('button');
    toggleBtn.id = 'mmel-sidebar-toggle';
    toggleBtn.type = 'button';
    toggleBtn.innerHTML = '☰ Sidebar';
    toggleBtn.onclick = () => {
      document.body.classList.toggle('mmel-sidebar-collapsed');
      const collapsed = document.body.classList.contains('mmel-sidebar-collapsed');
      toggleBtn.innerHTML = collapsed ? '☰ Open Menu' : '✕ Hide';
    };

    const sidebar = document.createElement('aside');
    sidebar.id = 'mmel-sovereign-sidebar';

    const main = document.createElement('main');
    main.id = 'mmel-sovereign-main';

    const bodyChildren = Array.from(document.body.children).filter(
      (el) => el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE'
    );

    bodyChildren.forEach((el) => {
      const text = el.innerText || '';
      const isModal =
        el.getAttribute('role') === 'dialog' ||
        (el.className && el.className.toString().toLowerCase().includes('modal')) ||
        (getComputedStyle(el).position === 'fixed' && !text.includes('13 Suites'));

      if (isModal) return; // Keep MMEL MP3 Vault & modals untouched

      const isSidebarContent =
        el.tagName === 'HEADER' ||
        el.tagName === 'NAV' ||
        el.querySelector('video') ||
        el.querySelector('canvas') ||
        text.includes('SOVEREIGN REEL CINEMA') ||
        text.includes('13 Suites');

      if (isSidebarContent) {
        sidebar.appendChild(el);
      } else {
        main.appendChild(el);
      }
    });

    document.body.prepend(main);
    document.body.prepend(sidebar);
    document.body.prepend(toggleBtn);
    document.body.classList.add('mmel-sidebar-active');
  })();
</script>

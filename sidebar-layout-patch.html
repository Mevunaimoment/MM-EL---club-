<!-- === MMCC v26 RESPONSIVE SIDEBAR LAYOUT UPGRADE === -->
<!-- Paste this entire block right before the closing </body> tag of your v25 index.html -->
<style>
  :root {
    --mmcc-sidebar-w: 310px;
    --mmcc-bg-deep: #1a0207;
    --mmcc-bg-card: #2b040c;
    --mmcc-gold: #d4af37;
    --mmcc-gold-soft: rgba(212, 175, 55, 0.25);
  }

  /* Toggle Button */
  #mmcc-sidebar-toggle {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 9998;
    background: rgba(43, 4, 12, 0.92);
    color: var(--mmcc-gold);
    border: 1px solid var(--mmcc-gold-soft);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.25s ease;
  }
  #mmcc-sidebar-toggle:hover {
    border-color: var(--mmcc-gold);
    box-shadow: 0 0 14px rgba(212, 175, 55, 0.3);
  }

  /* Desktop Split-Screen Sidebar Shell */
  @media (min-width: 960px) {
    #mmcc-sidebar-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    body.mmcc-sidebar-active {
      display: grid !important;
      grid-template-columns: var(--mmcc-sidebar-w) 1fr !important;
      min-height: 100vh;
      margin: 0;
      padding: 0 !important;
      overflow-x: hidden;
    }

    body.mmcc-sidebar-active.mmcc-sidebar-collapsed {
      grid-template-columns: 0px 1fr !important;
    }

    #mmcc-sovereign-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: var(--mmcc-sidebar-w);
      overflow-y: auto;
      padding: 54px 18px 24px;
      background: linear-gradient(180deg, #2b040c 0%, #1a0207 100%);
      border-right: 1px solid var(--mmcc-gold-soft);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 900;
      transition: transform 0.3s ease, opacity 0.25s ease;
    }

    body.mmcc-sidebar-collapsed #mmcc-sovereign-sidebar {
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Keep embedded video compact inside sidebar */
    #mmcc-sovereign-sidebar video {
      width: 100% !important;
      max-height: 210px !important;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--mmcc-gold-soft);
    }

    #mmcc-sovereign-main {
      padding: 28px 36px 80px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* Convert bottom nav into vertical sidebar nav links on desktop */
    #mmcc-sovereign-sidebar nav,
    #mmcc-sovereign-sidebar [class*="bottom-nav"],
    #mmcc-sovereign-sidebar [class*="tab-bar"] {
      position: static !important;
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
      gap: 8px;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
    }

    #mmcc-sovereign-sidebar nav button,
    #mmcc-sovereign-sidebar nav a,
    #mmcc-sovereign-sidebar [class*="bottom-nav"] button {
      width: 100% !important;
      justify-content: flex-start !important;
      text-align: left !important;
      padding: 10px 14px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(212, 175, 55, 0.15) !important;
      background: rgba(255, 255, 255, 0.03) !important;
    }

    /* Custom subtle gold scrollbar for sidebar */
    #mmcc-sovereign-sidebar::-webkit-scrollbar {
      width: 4px;
    }
    #mmcc-sovereign-sidebar::-webkit-scrollbar-thumb {
      background: var(--mmcc-gold-soft);
      border-radius: 4px;
    }
  }
</style>

<script>
  (function initMMCCSidebar() {
    if (document.getElementById('mmcc-sovereign-sidebar')) return;

    const toggleBtn = document.createElement('button');
    toggleBtn.id = 'mmcc-sidebar-toggle';
    toggleBtn.type = 'button';
    toggleBtn.innerHTML = '☰ Sidebar';
    toggleBtn.onclick = () => {
      document.body.classList.toggle('mmcc-sidebar-collapsed');
      const collapsed = document.body.classList.contains('mmcc-sidebar-collapsed');
      toggleBtn.innerHTML = collapsed ? '☰ Open Menu' : '✕ Hide';
    };

    const sidebar = document.createElement('aside');
    sidebar.id = 'mmcc-sovereign-sidebar';

    const main = document.createElement('main');
    main.id = 'mmcc-sovereign-main';

    // Identify top header, video showcase, and bottom nav without touching modals
    const bodyChildren = Array.from(document.body.children).filter(
      (el) => el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE'
    );

    bodyChildren.forEach((el) => {
      const text = el.innerText || '';
      const isModal =
        el.getAttribute('role') === 'dialog' ||
        (el.className && typeof el.className === 'string' && el.className.toLowerCase().includes('modal')) ||
        (getComputedStyle(el).position === 'fixed' && !text.includes('13 Depts'));

      if (isModal) return; // Leave modals untouched in body

      const isSidebarContent =
        el.tagName === 'HEADER' ||
        el.tagName === 'NAV' ||
        el.querySelector('video') ||
        text.includes('RA 109 GOLD SILK MOTION') ||
        text.includes('13 Depts');

      if (isSidebarContent) {
        sidebar.appendChild(el);
      } else {
        main.appendChild(el);
      }
    });

    document.body.prepend(main);
    document.body.prepend(sidebar);
    document.body.prepend(toggleBtn);
    document.body.classList.add('mmcc-sidebar-active');
  })();
</script>
